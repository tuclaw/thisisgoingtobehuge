name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Detect chrome tests
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -Eq '^(camp-chat\.js|camp-chat\.css|app\.js|scripts/check-imessage-scroll-pause\.mjs)$'; then
            echo "chrome=true" >> "$GITHUB_OUTPUT"
          else
            echo "chrome=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Chrome
        if: steps.filter.outputs.chrome == 'true'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      - name: Build site
        run: node scripts/build.mjs
      - name: Check (fast)
        run: npm run check:fast
      - name: Check (chrome)
        if: steps.filter.outputs.chrome == 'true'
        run: npm run check:chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
